name: Atlas Syria News Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor official Telegram mirror
        run: python src/monitor.py

      - name: Create WordPress drafts when credentials are configured
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python src/wordpress_draft.py

      - name: Persist monitoring state
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state change."
          else
            git config user.name "atlas-syria-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/state.json
            git commit -m "Update Atlas Syria monitoring state"
            git push
          fi

      - name: Upload candidate posts
        uses: actions/upload-artifact@v4
        with:
          name: atlas-syria-news-candidates
          path: output/new_posts.json
          retention-days: 7
